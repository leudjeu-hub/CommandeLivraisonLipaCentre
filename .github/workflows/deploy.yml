# Publie le site sur GitHub Pages à chaque push sur main, et toutes les 3 heures pour rafraîchir la
# copie du catalogue (dist/catalogue.json, voir scripts/catalogue-snapshot.mjs).
# Prérequis (une seule fois) : Settings → Pages → Source : « GitHub Actions ».
name: Déploiement GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          BASE_PATH: /CommandeLivraisonLipaCentre/
      - run: npm test
      # Après les tests : ils vérifient le site avec une copie vide (public/catalogue.json)
      - run: node scripts/catalogue-snapshot.mjs dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
